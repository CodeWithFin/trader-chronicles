services:
  db:
    image: postgres:16-alpine
    container_name: trader-chronicles-db
    environment:
      POSTGRES_USER: ${DB_USER:-trader}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-trader_chronicles}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - trader_pgdata:/var/lib/postgresql/data
      - ./neon/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-trader} -d ${DB_NAME:-trader_chronicles}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    container_name: trader-chronicles-app
    environment:
      DATABASE_URL: postgresql://${DB_USER:-trader}:${DB_PASSWORD}@db:5432/${DB_NAME:-trader_chronicles}
      AUTH_SECRET: ${AUTH_SECRET}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://102.207.151.58:3050}
      NEXT_PUBLIC_IMAGEKIT_PUBLIC_KEY: ${NEXT_PUBLIC_IMAGEKIT_PUBLIC_KEY}
      IMAGEKIT_PRIVATE_KEY: ${IMAGEKIT_PRIVATE_KEY}
      COOKIE_SECURE: "false"
    ports:
      - "${APP_PORT:-3050}:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  trader_pgdata:
